@media print{.np,#sb,.top,#lg{display:none!important}#md{display:none!important}body.prm #app{display:none!important}body.prm #md{display:flex!important;position:static;background:none}body.prm #md button{display:none}#mn{padding:0}#rpw{zoom:1!important}.rpg{box-shadow:none;margin:0;break-after:page}}

 const b=unescape(encodeURIComponent(s)),l=b.length,w=[];for(let i=0;i<l;i++)w[i>>2]|=b.charCodeAt(i)<<(24-(i%4)*8);
 w[l>>2]|=128<<(24-(l%4)*8);w[(((l+8)>>6)+1)*16-1]=l*8;for(let k=0;k<w.length;k++)w[k]|=0;const h=H.slice(0,8);
 for(let j=0;j<w.length;j+=16){const x=w.slice(j,j+16),a=h.slice();for(let i=0;i<64;i++){if(i>=16){const g=x[i-15],d=x[i-2];x[i]=(x[i-16]+(((g>>>7)|(g<<25))^((g>>>18)|(g<<14))^(g>>>3))+x[i-7]+(((d>>>17)|(d<<15))^((d>>>19)|(d<<13))^(d>>>10)))|0}
  const e=a[4],t1=(a[7]+(((e>>>6)|(e<<26))^((e>>>11)|(e<<21))^((e>>>25)|(e<<7)))+((e&a[5])^(~e&a[6]))+K[i]+x[i])|0,f=a[0],t2=((((f>>>2)|(f<<30))^((f>>>13)|(f<<19))^((f>>>22)|(f<<10)))+((f&a[1])^(f&a[2])^(a[1]&a[2])))|0;
  a.pop();a.unshift((t1+t2)|0);a[4]=(a[4]+t1)|0}
  for(let i=0;i<8;i++)h[i]=(h[i]+a[i])|0}

function seed(){
 const pr=[['Sample Item A','SKU-001','General','Brand A',50,80,40,10],['Sample Item B','SKU-002','General','Brand A',120,180,15,5],['Bottled Water 500ml','SKU-003','Beverages','Brand B',10,18,120,30],['Soda Can','SKU-004','Beverages','Brand B',22,35,60,20],['Chips Pack','SKU-005','Snacks','Brand C',15,25,3,10],['Biscuits','SKU-006','Snacks','Brand C',8,15,0,15],['Dish Soap','SKU-007','Household','Brand D',35,60,18,6],['Tissue Roll','SKU-008','Household','Brand D',12,20,5,10],['Shampoo Sachet','SKU-009','Personal Care','Brand E',4,8,90,30],['Soap Bar','SKU-010','Personal Care','Brand E',18,30,25,8]];
 const products=pr.map((a,i)=>({id:'p'+i,name:a[0],sku:a[1],barcode:'48000'+i,cat:a[2],brand:a[3],sup:'s0',cost:a[4],price:a[5],stock:a[6],re:a[7],unit:'pc',desc:'',active:true,upd:Date.now()}));
 const sales=[];const now=Date.now();
 for(let d=6;d>=0;d--)for(let j=0;j<3+(d%3);j++){const it=[0,1].map(k=>{const p=products[(d*3+j*2+k)%products.length];return{pid:p.id,name:p.name,qty:1+(j+k)%3,price:p.price,cost:p.cost}});const sub=it.reduce((s,x)=>s+x.qty*x.price,0);sales.push({id:uid(),no:'#'+String(sales.length+1).padStart(6,'0'),ts:now-d*DAY-j*3e6,items:it,sub,disc:0,tax:0,total:sub,pay:PAY[(d+j)%3],paid:sub,change:0,cust:'',cashier:'Admin'})}
 return{products,sales,moves:[],exp:[{id:uid(),date:new Date().toISOString().slice(0,10),cat:'Utilities',desc:'Electricity',sup:'',amt:1800,pay:'Cash',by:'Admin'}],
 cust:[{id:uid(),name:'Sample Customer',mobile:'09171234567',email:'',addr:'',pts:25,notes:''}],
 sup:[{id:'s0',name:'Sample Supplier',contact:'Ana Cruz',phone:'09181234567',email:'',addr:'',notes:'',bal:0}],
 po:[],staff:[{id:uid(),name:'Admin',user:ADMIN_USER,pw:ADMIN_HASH,role:'Owner',email:'',phone:'',status:'Active',last:''},{id:uid(),name:'Maria',user:'',pw:'',role:'Cashier',email:'',phone:'',status:'Active',last:''}],
 logs:[],held:[],set:{biz:'BNH Convenient Store',addr:'',phone:'',email:'',cur:'₱',tax:12,hdr:'',ftr:'Thank you for your purchase!',pay:'Cash',disc:true,taxOn:false,auto:true,lowA:true,dre:10,neg:false,appr:false},seq:100}}
function load(){try{D=JSON.parse(localStorage.getItem(KEY))}catch(e){}if(!D)D=seed();if(!D.staff.some(s=>s.user==ADMIN_USER)){const o=D.staff.find(s=>s.role=='Owner')||D.staff[0];o.user=ADMIN_USER;o.pw=ADMIN_HASH;o.role='Owner';o.status='Active'}}

function log(a,m,d){D.logs.unshift({ts:Date.now(),by:U?.name||'',a,m,d});D.logs=D.logs.slice(0,300);save()}
const pid=id=>D.products.find(p=>p.id==id),st=p=>p.stock<=0?'Out of Stock':p.stock<=p.re?'Low Stock':p.stock>p.re*4?'Overstocked':'In Stock';
const stc=s=>s=='In Stock'?'ok':s=='Low Stock'||s=='Overstocked'?'wa':'er';
const dt=t=>new Date(t).toLocaleString('en-PH',{dateStyle:'medium',timeStyle:'short'});
function move(p,type,q,reason,ref){const prev=p.stock;p.stock=Math.max(D.set.neg?-1e9:0,prev+q);p.upd=Date.now();D.moves.unshift({ts:Date.now(),pid:p.id,name:p.name,type,q,prev,now:p.stock,reason:reason||'',by:U?.name||'',ref:ref||'-'});save()}
function range(k){const n=new Date(),s=new Date(n.getFullYear(),n.getMonth(),n.getDate()).getTime();
 if(k=='0')return[s,s+DAY];if(k=='y')return[s-DAY,s];if(k=='7')return[s-6*DAY,s+DAY];if(k=='30')return[s-29*DAY,s+DAY];
 if(k=='m')return[new Date(n.getFullYear(),n.getMonth(),1).getTime(),s+DAY];if(k=='lm')return[new Date(n.getFullYear(),n.getMonth()-1,1).getTime(),new Date(n.getFullYear(),n.getMonth(),1).getTime()];
 return[R.from?new Date(R.from).getTime():0,R.to?new Date(R.to).getTime()+DAY:Infinity]}
const inR=(t,k)=>{const[a,b]=range(k);return t>=a&&t<b};
function met(sales){const rev=sales.reduce((s,x)=>s+x.total-x.tax,0),cogs=sales.reduce((s,x)=>s+x.items.reduce((a,i)=>a+i.qty*i.cost,0),0),items=sales.reduce((s,x)=>s+x.items.reduce((a,i)=>a+i.qty,0),0);return{rev,cogs,gp:rev-cogs,n:sales.length,items,avg:sales.length?rev/sales.length:0}}
function prodStats(sales){const m={};sales.forEach(s=>s.items.forEach(i=>{const r=m[i.pid]||(m[i.pid]={name:i.name,q:0,rev:0,cost:0,pid:i.pid});r.q+=i.qty;r.rev+=i.qty*i.price;r.cost+=i.qty*i.cost}));return Object.values(m).map(r=>({...r,profit:r.rev-r.cost,mg:r.rev?(r.rev-r.cost)/r.rev*100:0})).sort((a,b)=>b.q-a.q)}
const tbl=(h,r)=>`<div class="tw"><table><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr>${r.map(x=>`<tr>${x.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')||`<tr><td colspan="${h.length}" class="k">No records yet.</td></tr>`}</table></div>`;
const card=(k,v)=>`<div class="cd"><div class="k">${k}</div><div class="v">${v}</div></div>`;
const bd=(t,c)=>`<span class="b ${c||stc(t)}">${t}</span>`;
function modal(html){$('#mi').innerHTML=html;$('#md').style.display='flex'}const closeM=()=>$('#md').style.display='none';

 $('#fok').onclick=()=>{const o={};f.forEach(x=>{let v=$('#f_'+x.k).value;o[x.k]=x.t=='number'?+v||0:v});if(cb(o)!==false)closeM()}}

let LT=0,LU=0;
function login(){$('#app').innerHTML=`<div id="lg" class="cd"><img src="logo.png" alt="BNH Convenient Store and Trading"><h2 style="color:var(--pr);text-align:center;margin:4px 0 8px">POS &amp; Inventory</h2><label>Username<input id="lu" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false"></label><label>Password<input id="lp" type="password" autocomplete="current-password"></label><div id="le" style="color:var(--er);min-height:18px;margin-top:6px"></div><button class="p" style="width:100%;margin-top:8px" onclick="doLogin()">Login</button></div>`;$('#lp').onkeydown=e=>{if(e.key=='Enter')doLogin()};$('#lu').onkeydown=e=>{if(e.key=='Enter')$('#lp').focus()}}
function doLogin(){const u=$('#lu').value.trim().toLowerCase(),pw=$('#lp').value,er=m=>{$('#le').textContent=m};
 if(Date.now()<LT)return er('Too many attempts. Wait '+Math.ceil((LT-Date.now())/1000)+'s.');

 if(!s||s.pw!=hp(u,pw)){if(++LU>=5){LU=0;LT=Date.now()+30000}return er('Invalid username or password.')}
 LU=0;U=s;s.last=dt(Date.now());V=ROLES[s.role][0];col=innerWidth<900;log('Login','Staff',s.name+' logged in');draw()}

 $('#app').innerHTML=`<div id="sb" class="${col?'c':''}"><img class="lg" src="logo.png" alt="logo"><h3 style="text-align:center">${esc(D.set.biz)}</h3>${ok.map(n=>`<a class="${n==V?'on':''}" onclick="nav('${n}')">${n}</a>`).join('')}<a onclick="U=null;draw()">Logout</a></div><div id="mn"><div class="top"><button onclick="col=!col;draw()">☰</button><h2>${V}</h2><span class="k">${esc(U.name)} · ${U.role}</span></div>${VIEWS[V]()}</div>`}
const S=()=>D.sales;
const VIEWS={
Dashboard(){const t=met(S().filter(s=>inR(s.ts,'0'))),ex=D.exp.filter(e=>e.date==new Date().toISOString().slice(0,10)).reduce((s,e)=>s+e.amt,0),act=D.products.filter(p=>p.active),low=act.filter(p=>st(p)=='Low Stock'),out=act.filter(p=>p.stock<=0),iv=act.reduce((s,p)=>s+p.stock*p.cost,0),pp=act.reduce((s,p)=>s+p.stock*(p.price-p.cost),0);
 const days=[...Array(7)].map((_,i)=>{const d=6-i,a=new Date(new Date().toDateString()).getTime()-d*DAY,m=met(S().filter(s=>s.ts>=a&&s.ts<a+DAY));return{l:new Date(a).toLocaleDateString('en',{weekday:'short'}),s:m.rev,p:m.gp}}),mx=Math.max(1,...days.map(d=>d.s));

 const top=prodStats(S().filter(s=>inR(s.ts,'30'))).slice(0,5);
 return`<div class="g">${card('Today’s Sales',P(t.rev))}${card('Today’s Profit',P(t.gp))}${card('Today’s Expenses',P(ex))}${card('Transactions',t.n)}${card('Low Stock',low.length+' Items')}${card('Out of Stock',out.length+' Items')}${card('Inventory Value',P(iv))}${card('Potential Profit',P(pp))}</div>
 <div class="cd" style="margin-bottom:12px"><b>Quick Actions</b><div class="chips"><button class="p" onclick="nav('POS')">New Sale</button><button onclick="editProd()">Add Product</button><button onclick="nav('Inventory')">Add Stock</button><button onclick="addExp()">Record Expense</button><button onclick="nav('Reports')">View Reports</button></div></div>

POS(){const list=D.products.filter(p=>p.active&&(C.cat=='All'||p.cat==C.cat)&&(p.name+p.sku+p.barcode).toLowerCase().includes(C.q.toLowerCase()));const c=cartT();
 return`<div class="pos"><div><input id="pq" placeholder="Search name, SKU, barcode..." value="${esc(C.q)}" oninput="C.q=this.value;posRefresh()" style="width:100%"><div class="chips">${['All',...CATS].map(x=>`<button class="${x==C.cat?'on':''}" onclick="C.cat='${x}';draw()">${x}</button>`).join('')}</div><div class="tiles">${list.map(p=>`<button class="tile" onclick="addCart('${p.id}')"><b>${esc(p.name)}</b>${P(p.price)}<br><span class="k">Stock ${p.stock}</span></button>`).join('')}</div></div>
